<div class="passage">
  @if (!usfm()) {
    <p class="passage__hint">Choose a version, book and chapter to start reading.</p>
  }
  @if (loading()) {
    <div class="passage__loading" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </div>
  }
  @if (error()) {
    <p class="passage__error" role="alert">{{error()}}</p>
  }
  @if (passage(); as p) {
    <h2 class="passage__reference">{{p.reference}}</h2>
    <p class="passage__content">{{p.content }}</p>
  }
</div>
