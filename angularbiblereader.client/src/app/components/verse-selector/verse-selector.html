<div class="verse-selector">
  <div class="field">
    <label class="field__label" for="verse-select">Verse</label>
    <div class="field__control">
      <select id="verse-select" class="field__select" [disabled]="!chapter()||loading()" (change)="onStartChange($any($event.target).value)">
        <option value="" selected>
          {{ !chapter()?'Choose a chapter first':loading()?'Loading…':'Whole chapter'}}
        </option>
        @for (verse of verses(); track verse.usfm) {
          <option [value]="verse.usfm">{{verse.human}}</option>
        }
      </select>
    </div>
  </div>
  <div class="field">
    <label class="field__label" for="verse-end-select">To</label>
    <div class="field__control">
      <select id="verse-end-select" class="field__select" [disabled]="!selectedStart()" (change)="onEndChange($any($event.target).value)">
        <option value="" selected>{{ !selectedStart()?'—':'Same verse' }}</option>
        @for (verse of endVerseOptions(); track verse.usfm) {
          <option [value]="verse.usfm">{{verse.human}}</option>
        }
      </select>
    </div>
  </div>
  @if (error()) {
    <p class="field__error" role="alert">{{error()}}</p>
  }
</div>
