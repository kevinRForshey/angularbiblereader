<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2>Create an account</h2>

  <label class="auth-form__field">
    <span>Display name</span>
    <input type="text" formControlName="displayName" autocomplete="name" />
    @if (form.controls.displayName.invalid && form.controls.displayName.touched) {
      <small class="auth-form__error">Display name is required.</small>
    }
  </label>

  <label class="auth-form__field">
    <span>Email</span>
    <input type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.touched && form.controls.email.hasError('required')) {
      <small class="auth-form__error">Email is required.</small>
    }
    @if (form.controls.email.touched && form.controls.email.hasError('email')) {
      <small class="auth-form__error">Enter a valid email address.</small>
    }
  </label>

  <label class="auth-form__field">
    <span>Password</span>
    <input type="password" formControlName="password" autocomplete="new-password" />
    @if (form.controls.password.touched && form.controls.password.hasError('required')) {
      <small class="auth-form__error">Password is required.</small>
    }
    @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
      <small class="auth-form__error">Password must be at least 8 characters.</small>
    }
  </label>

  <label class="auth-form__field">
    <span>Confirm password</span>
    <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    @if (form.controls.confirmPassword.touched && form.hasError('passwordsMismatch')) {
      <small class="auth-form__error">Passwords do not match.</small>
    }
  </label>

  @if (serverError()) {
    <p class="auth-form__error auth-form__error--server">{{ serverError() }}</p>
  }

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Creating account…' : 'Create account' }}
  </button>

  <p class="auth-form__switch">Already have an account? <a routerLink="/login">Sign in</a></p>
</form>
