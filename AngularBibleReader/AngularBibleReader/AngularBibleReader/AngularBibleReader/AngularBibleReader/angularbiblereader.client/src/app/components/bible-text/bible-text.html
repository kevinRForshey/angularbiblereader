<div class="passage">
  <p class="hint" *ngIf="!usfm()">Choose a version, book and chapter to start reading.</p>

  <p class="loading" *ngIf="loading()">Loading…</p>

  <p class="error" *ngIf="error()">{{ error() }}</p>

  <ng-container *ngIf="passage() as p">
    <h3>{{ p.reference }}</h3>
    <p class="content">{{ p.content }}</p>
  </ng-container>
</div>
