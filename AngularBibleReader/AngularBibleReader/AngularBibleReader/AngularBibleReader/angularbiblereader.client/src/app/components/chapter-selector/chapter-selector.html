<div class="field">
  <label class="field__label" for="chapter-select">Chapter</label>
  <div class="field__control">
    <select id="chapter-select" class="field__select" [disabled]="!book()||loading()" (change)="onChange($any($event.target).value)">
      <option value="" selected disabled>
        {{ !book()?'Choose a book first':loading()?'Loading…':'Choose a chapter' }}
      </option>
      <option *ngFor="let chapter of chapters()" [value]="chapter.usfm">{{chapter.human}}</option>
    </select>
  </div>
  <p class="field__error" *ngIf="error()" role="alert">{{error()}}</p>
</div>
