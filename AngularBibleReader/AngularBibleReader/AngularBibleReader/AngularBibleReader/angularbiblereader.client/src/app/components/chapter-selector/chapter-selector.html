<div class="selector">
  <label for="chapter-select">Chapter</label>
  <select id="chapter-select" [disabled]="!book()||loading()" (change)="onChange($any($event.target).value)">
<option value="" selected disabled>
{{ !book()?'Choose a book first':loading()?'Loading…':'Choose a chapter' }}
</option>
<option *ngFor="let chapter of chapters()" [value]="chapter.usfm">{{chapter.human}}</option>
</select>
  <p class="error" *ngIf="error()">{{error()}}</p>
</div>
