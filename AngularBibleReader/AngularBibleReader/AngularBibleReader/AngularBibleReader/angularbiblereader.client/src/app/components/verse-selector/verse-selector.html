<div class="selector">
  <label for="verse-select">Verse</label>
  <select id="verse-select" [disabled]="!chapter()||loading()" (change)="onChange($any($event.target).value)"
<option value="" selected>
{{ !chapter()?'Chooseachapterfirst':loading()?'Loading…':'Wholechapter'}}
</option>
<option *ngFor="let verseof verses()" [value]="verse.usfm">{{verse.human}}</option>
</select>
  <p class="error" *ngIf="error()">{{error()}}</p>
</div>
