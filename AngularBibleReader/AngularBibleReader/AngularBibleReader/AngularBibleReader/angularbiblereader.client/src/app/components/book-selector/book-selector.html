<div class="selector">
  <label for="book-select">Book</label>
  <select id="book-select" [disabled]="!version()||loading()" (change)="onChange($any($event.target).value)"
<option value="" selecteddisabled>
{{ !version()?'Chooseaversionfirst':loading()?'Loading…':'Choosea book'}}
</option>
<option *ngFor="let bookofbooks()" [value]="book.usfm">{{book.human}}</option>
</select>
  <p class="error" *ngIf="error()">{{error()}}</p>
</div>
